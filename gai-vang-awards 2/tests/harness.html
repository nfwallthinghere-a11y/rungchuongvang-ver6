<!DOCTYPE html><html><head><meta charset="utf-8"><title>harness</title><link rel="icon" href="data:,">
<style>html,body{margin:0}iframe{width:100%;height:620px;border:3px solid #333;display:block}</style>
</head><body>
<iframe id="f-mc" allow="microphone *"></iframe><iframe id="f-kg" allow="microphone *"></iframe><iframe id="f-a" allow="microphone *"></iframe><iframe id="f-b" allow="microphone *"></iframe>
<script>
window.__ready = 0;
function mount(id, hash) {
  return new Promise(res => {
    const f = document.getElementById(id);
    const h = () => { f.removeEventListener('load', h); window.__ready++; res(f); };
    f.addEventListener('load', h);
    f.src = '../rungchuongvang-index4.html' + hash;
  });
}
window.__mount = mount;
window.__seedTen = (room, ten) => localStorage.setItem('rcv.doi.' + room + '.ten', JSON.stringify(ten));
window.__addFrame = (id) => {
  const f = document.createElement('iframe'); f.id = id; f.setAttribute('allow','microphone *'); document.body.appendChild(f); return true;
};
</script>
</body></html>
